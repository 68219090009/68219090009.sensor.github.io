<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เซ็นเซอร์อุตสาหกรรมเบื้องต้น</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Noto Sans Thai", Tahoma, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #e0f2fe, #f8fafc 55%, #dcfce7);
    }

    main {
      width: min(100%, 760px);
      padding: 48px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(23, 32, 51, 0.14);
    }

    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 14px;
      border-radius: 999px;
      color: #075985;
      background: #e0f2fe;
      font-size: 0.9rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      color: #0f3d5e;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.25;
    }

    p {
      margin: 20px 0 0;
      color: #475569;
      font-size: 1.1rem;
    }

    @media (max-width: 560px) {
      main { padding: 36px 24px; }
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">รายวิชา</span>
    <h1>วิชาเซ็นเซอร์อุตสาหกรรมเบื้องต้น</h1>
    <p>68219090009 นายธนภัทร ชูเชิดรัตน์</p>
  </main>
</body>
</html>
